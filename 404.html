<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — GTEC Conference Facility</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #060e1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 100vh;
      position: relative;
    }

    /* ═══ SKY / SCENE ═══════════════════════════════════════ */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .scene svg {
      width: 100%;
      height: 100%;
    }

    /* Star twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.9; }
      50%       { opacity: 0.2; }
    }

    .star { animation: twinkle var(--d, 3s) ease-in-out infinite; }

    /* Moon glow pulse */
    @keyframes moon-glow {
      0%, 100% { opacity: 0.18; r: 54px; }
      50%       { opacity: 0.28; r: 62px; }
    }

    .moon-halo { animation: moon-glow 5s ease-in-out infinite; }

    /* Camel walk cycle */
    @keyframes walk {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-110vw); }
    }

    .camel-group {
      animation: walk 28s linear infinite;
    }

    /* Shimmer on sand */
    @keyframes shimmer {
      0%, 100% { opacity: 0; }
      50%       { opacity: 0.06; }
    }

    .heat { animation: shimmer 4s ease-in-out infinite; }

    /* ═══ CONTENT ════════════════════════════════════════════ */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 24px 10vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* floating URL badge */
    .url-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.22);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(201,168,76,0.75);
      margin-bottom: 22px;
    }

    .url-badge span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(201,168,76,0.55);
      flex-shrink: 0;
    }

    /* 404 number */
    .giant {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: clamp(100px, 22vw, 200px);
      line-height: 0.85;
      letter-spacing: -0.06em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(201,168,76,0.22);
      position: relative;
      user-select: none;
      margin-bottom: 10px;
    }

    .giant::before {
      content: '404';
      position: absolute; inset: 0;
      background: linear-gradient(
        170deg,
        rgba(201,168,76,0.9)  0%,
        rgba(232,201,122,0.7) 40%,
        rgba(201,168,76,0.15) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      -webkit-text-stroke: 0;
    }

    /* tagline */
    .tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.1rem, 2.5vw, 1.7rem);
      font-weight: 700;
      font-style: italic;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.01em;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.38);
      line-height: 1.75;
      max-width: 400px;
      margin-bottom: 32px;
    }

    /* action row */
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 28px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: linear-gradient(135deg, #c9a84c, #e8c97a);
      color: #060e1a;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      padding: 13px 26px;
      border-radius: 10px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(201,168,76,0.45);
    }

    .btn-home svg { width: 14px; height: 14px; transition: transform 0.2s; }
    .btn-home:hover svg { transform: translateX(3px); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: rgba(255,255,255,0.45);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.85rem;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: color 0.2s, border-color 0.2s;
    }

    .btn-ghost:hover {
      color: rgba(232,201,122,0.85);
      border-color: rgba(201,168,76,0.3);
    }

    /* quick links */
    .quick {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .quick a {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255,255,255,0.28);
      text-decoration: none;
      padding: 4px 12px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      letter-spacing: 0.04em;
      transition: color 0.2s, border-color 0.2s;
    }

    .quick a:hover {
      color: rgba(232,201,122,0.7);
      border-color: rgba(201,168,76,0.2);
    }

    /* wrongly typed URL display */
    .bad-url {
      font-family: 'DM Sans', monospace;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .bad-url strong { color: rgba(220,80,80,0.6); }

    /* ═══ RESPONSIVE ════════════════════════════════════════ */
    @media (max-width: 520px) {
      body { overflow: auto; }
      html, body { height: auto; }
      .scene { position: fixed; }
      .giant { font-size: clamp(88px, 26vw, 130px); }
    }
  </style>
</head>
<body>

<!-- ═══ SCENE ══════════════════════════════════════════════ -->
<div class="scene" aria-hidden="true">
<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="100%">
      <stop offset="0%"   stop-color="#0d1e38"/>
      <stop offset="60%"  stop-color="#060e1a"/>
      <stop offset="100%" stop-color="#030710"/>
    </radialGradient>

    <radialGradient id="moon-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e8c97a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8c97a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="horizon-glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#c9a84c" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#8a5a0a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060e1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sand-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a2500"/>
      <stop offset="100%" stop-color="#1a1000"/>
    </linearGradient>

    <linearGradient id="dune1-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2e1d08"/>
      <stop offset="100%" stop-color="#1a1000"/>
    </linearGradient>

    <linearGradient id="dune2-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1c1106"/>
      <stop offset="100%" stop-color="#100a03"/>
    </linearGradient>

    <filter id="soft-blur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tiny-blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Comet tail gradients — x2="0" means RIGHT side is transparent (tail), x2="1" left is bright (wrong) -->
    <!-- All comets travel LEFT→RIGHT so: left anchor (x1) = tail = transparent, right anchor (x2) = head = bright -->
    <linearGradient id="comet-tail-1" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" x1="0" x2="90">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="comet-tail-2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0%"   stop-color="#e8c97a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e8c97a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="comet-tail-3" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="110" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="comet-tail-4" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="0">
      <stop offset="0%"   stop-color="#f5e9c2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5e9c2" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="900" fill="url(#sky)"/>

  <!-- Horizon glow -->
  <rect width="1440" height="900" fill="url(#horizon-glow)"/>

  <!-- Moon halo (animated) -->
  <circle class="moon-halo" cx="1100" cy="140" r="56" fill="url(#moon-light)" filter="url(#soft-blur)"/>

  <!-- Moon -->
  <circle cx="1100" cy="140" r="36" fill="#f5e9c2" opacity="0.92"/>
  <!-- Moon craters (subtle) -->
  <circle cx="1090" cy="130" r="5" fill="#e0cc99" opacity="0.4"/>
  <circle cx="1108" cy="148" r="3" fill="#e0cc99" opacity="0.3"/>
  <circle cx="1095" cy="152" r="2" fill="#e0cc99" opacity="0.25"/>

  <!-- Stars — scattered -->
  <!-- Row 1 -->
  <circle class="star" cx="60"   cy="40"  r="1.2" fill="#fff" style="--d:2.8s"/>
  <circle class="star" cx="180"  cy="22"  r="0.8" fill="#fff" style="--d:3.5s; animation-delay:0.4s"/>
  <circle class="star" cx="260"  cy="60"  r="1.5" fill="#e8c97a" opacity="0.9" style="--d:4.1s; animation-delay:1s"/>
  <circle class="star" cx="390"  cy="18"  r="0.9" fill="#fff" style="--d:2.2s; animation-delay:0.7s"/>
  <circle class="star" cx="440"  cy="55"  r="1.1" fill="#fff" style="--d:3.8s"/>
  <circle class="star" cx="540"  cy="30"  r="1.4" fill="#fff" style="--d:5.0s; animation-delay:1.5s"/>
  <circle class="star" cx="620"  cy="70"  r="0.7" fill="#fff" style="--d:2.6s; animation-delay:0.2s"/>
  <circle class="star" cx="700"  cy="14"  r="1.0" fill="#e8c97a" opacity="0.7" style="--d:3.2s; animation-delay:0.9s"/>
  <circle class="star" cx="780"  cy="46"  r="0.8" fill="#fff" style="--d:4.4s; animation-delay:0.3s"/>
  <circle class="star" cx="840"  cy="22"  r="1.3" fill="#fff" style="--d:2.9s; animation-delay:1.2s"/>
  <circle class="star" cx="920"  cy="68"  r="0.6" fill="#fff" style="--d:3.7s"/>
  <circle class="star" cx="1010" cy="28"  r="1.1" fill="#fff" style="--d:4.8s; animation-delay:0.6s"/>
  <circle class="star" cx="1200" cy="50"  r="0.9" fill="#fff" style="--d:3.1s; animation-delay:1.8s"/>
  <circle class="star" cx="1280" cy="20"  r="1.4" fill="#e8c97a" opacity="0.75" style="--d:2.5s"/>
  <circle class="star" cx="1360" cy="55"  r="0.8" fill="#fff" style="--d:4.2s; animation-delay:0.5s"/>
  <circle class="star" cx="1420" cy="34"  r="1.0" fill="#fff" style="--d:3.6s; animation-delay:1.1s"/>

  <!-- Row 2 deeper sky -->
  <circle class="star" cx="110"  cy="110" r="0.8" fill="#fff" style="--d:5.2s; animation-delay:0.8s"/>
  <circle class="star" cx="310"  cy="130" r="1.0" fill="#fff" style="--d:3.3s; animation-delay:1.4s"/>
  <circle class="star" cx="500"  cy="100" r="0.7" fill="#fff" style="--d:2.7s"/>
  <circle class="star" cx="660"  cy="125" r="1.2" fill="#fff" style="--d:4.6s; animation-delay:0.9s"/>
  <circle class="star" cx="820"  cy="105" r="0.9" fill="#e8c97a" opacity="0.6" style="--d:3.9s; animation-delay:1.6s"/>
  <circle class="star" cx="990"  cy="118" r="0.7" fill="#fff" style="--d:2.4s; animation-delay:0.4s"/>
  <circle class="star" cx="1160" cy="90"  r="1.1" fill="#fff" style="--d:5.5s; animation-delay:1.0s"/>
  <circle class="star" cx="1340" cy="115" r="0.8" fill="#fff" style="--d:3.0s; animation-delay:0.7s"/>

  <!-- More faint stars -->
  <circle class="star" cx="155"  cy="175" r="0.6" fill="#fff" opacity="0.5" style="--d:6.0s"/>
  <circle class="star" cx="348"  cy="190" r="0.5" fill="#fff" opacity="0.5" style="--d:4.8s; animation-delay:2s"/>
  <circle class="star" cx="575"  cy="165" r="0.7" fill="#fff" opacity="0.5" style="--d:5.3s; animation-delay:0.6s"/>
  <circle class="star" cx="755"  cy="180" r="0.5" fill="#fff" opacity="0.4" style="--d:3.6s; animation-delay:1.3s"/>
  <circle class="star" cx="900"  cy="170" r="0.6" fill="#fff" opacity="0.5" style="--d:7.0s; animation-delay:0.2s"/>
  <circle class="star" cx="1070" cy="160" r="0.5" fill="#e8c97a" opacity="0.4" style="--d:4.2s; animation-delay:1.7s"/>
  <circle class="star" cx="1240" cy="175" r="0.6" fill="#fff" opacity="0.5" style="--d:5.8s; animation-delay:0.3s"/>

  <!-- Milky Way band (subtle) -->
  <ellipse cx="400" cy="100" rx="420" ry="55" fill="#e8c97a" opacity="0.018" filter="url(#soft-blur)"/>

  <!-- ─── COMETS ─────────────────────────────────────────── -->

  <!-- Comet 1 — left to right, head leads, tail trails behind -->
  <g>
    <line x1="-90" y1="-14" x2="0" y2="0" stroke="url(#comet-tail-1)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.8" fill="#fff" opacity="0.95"/>
    <animateTransform attributeName="transform" type="translate"
      values="-100,60; 1650,310"
      dur="2.2s" begin="0s; c1.end+3.1s" repeatCount="indefinite" id="c1"/>
  </g>

  <!-- Comet 2 — left to right, gold, shallower angle -->
  <g>
    <line x1="-100" y1="-8" x2="0" y2="0" stroke="url(#comet-tail-2)" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.6" fill="#e8c97a" opacity="0.92"/>
    <animateTransform attributeName="transform" type="translate"
      values="-100,120; 1650,240"
      dur="1.9s" begin="1.4s; c2.end+3.4s" repeatCount="indefinite" id="c2"/>
  </g>

  <!-- Comet 3 — left to right, fast, faint, very shallow -->
  <g>
    <line x1="-110" y1="-5" x2="0" y2="0" stroke="url(#comet-tail-3)" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.1" fill="#fff" opacity="0.7"/>
    <animateTransform attributeName="transform" type="translate"
      values="-110,30; 1650,170"
      dur="1.6s" begin="2.8s; c3.end+4.0s" repeatCount="indefinite" id="c3"/>
  </g>

  <!-- Comet 4 — left to right, cream, steeper angle -->
  <g>
    <line x1="-80" y1="-20" x2="0" y2="0" stroke="url(#comet-tail-4)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#f5e9c2" opacity="0.85"/>
    <animateTransform attributeName="transform" type="translate"
      values="-80,80; 1650,380"
      dur="2.0s" begin="4.5s; c4.end+3.6s" repeatCount="indefinite" id="c4"/>
  </g>

  <!-- ─── LANDSCAPE ─────────────────────────────────────── -->

  <!-- Background distant dunes (very dark) -->
  <path d="M0 640 Q180 580 360 620 Q540 660 720 600 Q900 540 1080 590 Q1260 640 1440 610 L1440 900 L0 900 Z"
        fill="#0d0800" opacity="0.9"/>

  <!-- Mid dunes -->
  <path d="M0 680 Q200 640 420 665 Q600 688 780 650 Q960 615 1140 658 Q1320 695 1440 660 L1440 900 L0 900 Z"
        fill="url(#dune2-grad)"/>

  <!-- Foreground dune left -->
  <path d="M-20 900 Q80 800 260 770 Q380 755 480 800 Q560 838 640 900 Z"
        fill="#1e1205"/>

  <!-- Main sand floor -->
  <path d="M0 730 Q360 700 720 718 Q1080 736 1440 715 L1440 900 L0 900 Z"
        fill="url(#sand-grad)"/>

  <!-- Sand texture ripples (very subtle) -->
  <path d="M0 790 Q240 785 480 792 Q720 800 960 788 Q1200 776 1440 784"
        stroke="#c9a84c" stroke-width="0.4" fill="none" opacity="0.07"/>
  <path d="M0 810 Q300 804 600 812 Q900 820 1200 808 Q1380 800 1440 805"
        stroke="#c9a84c" stroke-width="0.3" fill="none" opacity="0.05"/>
  <path d="M0 825 Q200 820 450 827 Q700 835 950 824 Q1200 813 1440 820"
        stroke="#c9a84c" stroke-width="0.3" fill="none" opacity="0.04"/>

  <!-- Heat shimmer overlay -->
  <rect class="heat" x="200" y="720" width="600" height="30" fill="#c9a84c" filter="url(#tiny-blur)"/>

  <!-- ─── CACTUS ──────────────────────────────────────────── -->
  <!-- Left cactus group -->
  <g transform="translate(200, 610)">
    <!-- Main trunk -->
    <rect x="0" y="0" width="14" height="120" rx="7" fill="#0e1f0e"/>
    <!-- Left arm -->
    <rect x="-24" y="28" width="12" height="55" rx="6" fill="#0e1f0e"/>
    <rect x="-24" y="28" width="37" height="12" rx="6" fill="#0e1f0e"/>
    <!-- Right arm -->
    <rect x="14" y="45" width="12" height="48" rx="6" fill="#0e1f0e"/>
    <rect x="1" y="45" width="37" height="12" rx="6" fill="#0e1f0e"/>
    <!-- Spine dots -->
    <circle cx="7" cy="15" r="1" fill="#1a3a1a" opacity="0.6"/>
    <circle cx="7" cy="35" r="1" fill="#1a3a1a" opacity="0.6"/>
    <circle cx="7" cy="60" r="1" fill="#1a3a1a" opacity="0.6"/>
  </g>

  <!-- Small right cactus -->
  <g transform="translate(1180, 642)">
    <rect x="0" y="0" width="10" height="88" rx="5" fill="#0e1f0e"/>
    <rect x="-18" y="30" width="10" height="40" rx="5" fill="#0e1f0e"/>
    <rect x="-18" y="30" width="28" height="10" rx="5" fill="#0e1f0e"/>
    <rect x="10" y="42" width="10" height="34" rx="5" fill="#0e1f0e"/>
    <rect x="0" y="42" width="28" height="10" rx="5" fill="#0e1f0e"/>
  </g>

  <!-- ─── CAMEL CARAVAN ─────────────────────────────────── -->
  <g class="camel-group" transform="translate(1500, 0)">
    <!-- Camel 1 -->
    <g transform="translate(0, 666)" opacity="0.55">
      <!-- Body -->
      <ellipse cx="50" cy="0" rx="38" ry="22" fill="#1a1000"/>
      <!-- Hump -->
      <ellipse cx="50" cy="-18" rx="18" ry="14" fill="#1a1000"/>
      <!-- Neck -->
      <rect x="72" y="-22" width="10" height="32" rx="5" fill="#1a1000" transform="rotate(-15, 72, -22)"/>
      <!-- Head -->
      <ellipse cx="90" cy="-22" rx="12" ry="8" fill="#1a1000"/>
      <!-- Legs -->
      <rect x="24" y="18" width="7" height="26" rx="3" fill="#1a1000"/>
      <rect x="36" y="18" width="7" height="26" rx="3" fill="#1a1000"/>
      <rect x="58" y="18" width="7" height="26" rx="3" fill="#1a1000"/>
      <rect x="70" y="18" width="7" height="26" rx="3" fill="#1a1000"/>
      <!-- Tail -->
      <path d="M14 -2 Q4 -10 8 -18" stroke="#1a1000" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Rider silhouette -->
      <ellipse cx="48" cy="-38" rx="7" ry="9" fill="#0f0900"/>
      <rect x="42" y="-30" width="12" height="16" rx="3" fill="#0f0900"/>
    </g>

    <!-- Camel 2 (behind, smaller) -->
    <g transform="translate(-120, 670)" opacity="0.35">
      <ellipse cx="44" cy="0" rx="32" ry="19" fill="#150e00"/>
      <ellipse cx="44" cy="-15" rx="15" ry="11" fill="#150e00"/>
      <rect x="64" y="-18" width="8" height="26" rx="4" fill="#150e00" transform="rotate(-15, 64, -18)"/>
      <ellipse cx="79" cy="-18" rx="10" ry="7" fill="#150e00"/>
      <rect x="20" y="16" width="6" height="22" rx="3" fill="#150e00"/>
      <rect x="30" y="16" width="6" height="22" rx="3" fill="#150e00"/>
      <rect x="50" y="16" width="6" height="22" rx="3" fill="#150e00"/>
      <rect x="60" y="16" width="6" height="22" rx="3" fill="#150e00"/>
    </g>

    <!-- Camel 3 (furthest) -->
